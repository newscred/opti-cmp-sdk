name: Bug report
description: Report a problem with an SDK
labels: [bug]
body:
  - type: dropdown
    id: language
    attributes:
      label: SDK Language
      options:
        - JavaScript / TypeScript (opti-cmp)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: A minimal code sample or steps that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK Version
      placeholder: e.g. opti-cmp@0.0.4
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Language Runtime & Version
      placeholder: e.g. Node.js v20.x
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
    validations:
      required: false
