name: Feature request
description: Suggest an idea or enhancement
labels: [enhancement]
body:
  - type: dropdown
    id: language
    attributes:
      label: SDK Language
      options:
        - Other
        - JavaScript / TypeScript (@optimizely/cmp-sdk)
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve? What's the use case?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
    validations:
      required: false
