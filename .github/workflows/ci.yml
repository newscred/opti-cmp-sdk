name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: JS - Install Dependencies
        run: pnpm install
      - name: JS - Check Format
        run: pnpm exec prettier --cache --ignore-unknown --check .
      - name: JS - Lint
        run: pnpm exec eslint --cache --report-unused-disable-directives .
      - name: JS - Build SDK
        run: pnpm run build:js
      - name: JS - Test
        run: pnpm run test:js

  check-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24.x", "1.25.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/go.sum
      - name: Go - Check Format
        working-directory: go
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Go - Vet
        working-directory: go
        run: go vet ./...
      - name: Go - Build
        working-directory: go
        run: go build ./...
      - name: Go - Test
        working-directory: go
        run: go test ./...
      - name: Go - Check generated files are up to date
        working-directory: go
        run: |
          go generate ./...
          git diff --exit-code -- .

  convention:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Lint Pushed Commit Messages
        if: github.event_name == 'push'
        run: pnpm exec commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
      - name: Lint PR Commit Messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
